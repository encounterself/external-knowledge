# Project reference configuration. Install/merge it with `npm run codex:install`.
model = "databricks-gpt-5-6-luna"
model_provider = "openai_compatible"

[model_providers.openai_compatible]
name = "OpenAI-compatible API"
base_url = "${OPENAI_BASE_URL}"
env_key = "OPENAI_API_KEY"

[mcp_servers.env867]
command = "node"
args = ["tools/env867-mcp-server.mjs"]
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.env867.env]
ENV867_ROOT = "${ENV867_ROOT}"
