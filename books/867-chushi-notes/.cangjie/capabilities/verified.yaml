entry:
  name: "867-environmental-study"
  description: |
    用于学习和回答《867 环境学 初试高分笔记》覆盖的环境学问题：先识别污染源或形成条件，再追踪迁移转化与受体后果，最后按源头、过程、末端、监测和管理组织可评分答案。触发信号包括“环境污染原因/危害/防治”“水气土固废农业生态”“环评、监测、QA/QC、清洁生产、循环经济”。不用于替代最新版教材、官方大纲、现行法规标准或真实工程设计。
  core_principles:
    - "先用环境容量与自净能力判断负荷是否在情境中超载。"
    - "把污染物作为会迁移、转化、富集并影响受体的过程对象。"
    - "治理优先前移到清洁原料、源头减量和过程控制，再处理残余物。"
    - "技术选择必须匹配污染物性质、介质条件、目标、成本和二次污染风险。"
    - "用目的驱动的监测、质量控制和评价把数据转成治理决策。"
    - "规划先定目标并比较多方案，再安排实施保障和反馈。"
  out_of_scope:
    - "只要求查当前法律、排放标准、限值或最新政策的事实查询。"
    - "没有现场数据和专业设计条件的真实工程参数、设备定型或安全决策。"
    - "只要求背诵未经来源核验的常考概率、历史数据或作者信息。"
  stop_conditions:
    - "若题目要求现行法规、标准、阈值或最新真题证据，暂停套用资料并标记需要外部核验。"
    - "若缺少污染物、介质、受体或情境条件，不得假装给出唯一工艺选择，应先列出假设和信息缺口。"
    - "若原文表述疑似 OCR、错别字或反应式有冲突，保留原文锚点并明确不把它当作无条件事实。"
router_entry:
  name: "867-environmental-router"
  description: |
    这是《867 环境学 初试高分笔记》的来源路由入口。遇到环境学考研学习、简答/论述题、污染源—迁移—后果—防治分析、监测评价或可持续发展问题时，先按意图选择一张能力卡；富营养化、土壤修复和农业资源闭环保留在本路由内。它不替代最新版教材、官方考试大纲、现行法规标准或真实工程设计。
