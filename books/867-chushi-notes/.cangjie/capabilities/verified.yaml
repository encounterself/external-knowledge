    slug: "context-capacity"
    title: "情境化环境容量与自净超载判断"
    importance: critical
    importance_rationale: "阶段0将容量/自净列为第一章基础语言，且独立证据跨第一、二、四、十一章；它是判断污染是否成立和规划是否超载的前置节点。"
    one_liner: "先比较情境化输入负荷与容量/净化速率，再结合用途、污染物性质和受体后果判断是否超载。"
    intents:
      - "判断某排放是否构成环境污染"
      - "分析环境容量或自净能力是否被超过"
      - "解释同一排放在不同水体/土壤条件下的后果"
    keywords: ["环境容量", "自净能力", "超载", "纳污能力", "carrying capacity", "self-purification", "load threshold"]
    also_read: ["eutrophication-load", "soil-remediation", "agro-resource-loop", "planning-alternatives", "monitoring-data"]
    card: "cards/context-capacity.md"
    frontmatter:
      description: "当用户要判断排放是否超出环境容量、自净能力或功能目标时使用，尤其出现低流量、用途、水质目标、污染负荷、纳污能力等信号。不要用于只查一个现行限值或直接做工程许可判断；先区分符合单一排放标准与受体情境中实际超载。"
